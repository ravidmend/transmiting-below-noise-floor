id: hackathon_encoder
label: encoder
category: '[hackathon]'

templates:
  imports: from gnuradio import hackathon
  make: hackathon.encoder(${string_input}, ${pn_length}, ${sps}, ${fs}, ${key})

#  Make one 'parameters' list entry for every parameter you want settable from the GUI.
#     Keys include:
#     * id (makes the value accessible as keyname, e.g. in the make entry)
#     * label (label shown in the GUI)
#     * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#     * default
parameters:
- id: string_input
  label: string_input
  dtype: string
- id: pn_length
  label: pn
  dtype: int
- id: sps         
  label: sps
  dtype: float
- id: fs
  label: fs
  dtype: float
- id: key
  label: key
  dtype: int
#   label: string_input
#   dtype: float
# - id: p1
#   label: string_input
#   dtype: float
# - id: p2
#   label: string_input
#   dtype: float
# - id: p3
#   label: string_input
#   dtype: float
# - id: p4
#   label: string_input
#   dtype: float
#- id: ...
#  label: ...
#  dtype: ...

#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)

#inputs:
#- label: In
#  domain: ...
#  dtype: float
#  vlen: ...
#  optional: ...

outputs:
- label: Out
#  domain: ...
  dtype: float
#  vlen: ...
#  optional: ...

#  'file_format        ' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
